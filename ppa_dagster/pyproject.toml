[project]
name = "ppa_dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.23",
    # Dagster integrations referenced in src/ppa_dagster/defs/*/*.yaml
    "dagster-dbt==0.29.23",
    "dagster-sling==0.29.23",
    # Sling binary driver (pip picks the OS-correct build; never pin sling-mac-arm64)
    "sling==1.6.3",
    # dbt (DuckDB targets only — see ppa_dbt/profiles.yml)
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
    # Direct imports: defs/checks/schema_drift.py, scripts/duck-import.py
    "duckdb==1.5.5",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ppa_dagster"
registry_modules = [
    "ppa_dagster.components.*",
]


