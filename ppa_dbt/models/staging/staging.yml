version: 1

models:
  - name: stg_products
    description: "Staging model for products"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: category_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_categories')
                field: category_id
      - name: cost
        data_tests:
          - not_null
          - is_positive
      - name: price
        data_tests:
          - not_null
          - is_positive
      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_categories

    description: "Staging model for categories"
    columns:
      - name: category_id
        data_tests:
          - unique
          - not_null
      - name: category_name
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_payment_methods
    description: "Staging model for payment methods"
    columns:
      - name: payment_method_id
        data_tests:
          - unique
          - not_null
      - name: payment_method_name
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_customers
    description: "Staging model for customers"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_name
        data_tests:
          - not_null
      - name: customer_phone
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]+$'

      - name: customer_address

      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null
      - name: deleted_at

  - name: stg_devices
    description: "Staging model for devies"
    columns:
      - name: device_id
        data_tests:
          - unique
          - not_null
      
      - name: device_name
        data_tests:
          - not_null
      
      - name: created_at
        data_tests:
          - not_null
          
      - name: last_seen_at

  - name: stg_sales
    description: "Staging model for sales"
    columns:
      - name: sale_id
        data_tests:
          - unique
          - not_null

      - name: sale_receipt_number

      - name: device_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_devices')
                field: device_id

      - name: customer_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_customers')
                field: customer_id

      - name: sale_customer_name_snapshot

      - name: sale_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed','refunded','voided']

      - name: current_revision_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_sale_revisions')
                field: sale_revision_id

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: completed_at
        data_tests:
          - not_null

      - name: refunded_at

  - name: stg_sale_revisions
    description: "Staging model for sale revisions"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sale_id
              - sale_revision_number
    columns:
      - name: sale_revision_id
        data_tests:
          - unique
          - not_null

      - name: sale_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales')
                field: sale_id
      
      - name: sale_revision_number
        data_tests:
          - not_null

      - name: sale_revision_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['original', 'edit', 'full_refund']

      - name: sale_revision_subtotal
        data_tests:
          - not_null
          - is_positive

      - name: sale_revision_discount
        data_tests:
          - not_null
          - is_positive
      
      - name: sale_revision_total
        data_tests :
          - not_null
          - is_positive
      
      - name: sale_revision_change
        data_tests:
          - not_null
      
      - name: payment_method_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_payment_methods')
                field: payment_method_id
      
      - name: payment_method_name_snapshot
        data_tests:
          - not_null

      - name: created_at
        data_tests:
          - not_null
      
      - name: device_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_devices')
                field: device_id

  - name: stg_sale_revision_items
    description: "staging model for Sale revisions items"

    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null

      - name: sale_revision_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_sale_revisions')
                field: sale_revision_id

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      
      - name: product_name_snapshot
        data_tests:
          - not_null

      - name: category_name_snapshot

      
      - name: item_quantity 
        data_tests:
          - not_null
      
      - name: item_unit_cost
        data_tests:
          - not_null
      
      - name: item_unit_price
        data_tests:
          - not_null

      - name: item_line_total
        data_tests:
          - not_null

  - name: stg_payments

    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      
      - name: sale_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales')
                field: sale_id
      
      - name: sale_revision_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: 
                to: ref('stg_sale_revisions')
                field: sale_revision_id

      - name: payment_method_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_payment_methods')
                field: payment_method_id
      
      - name: payment_method_name_snapshot

      - name: payment_amount_tendered
        data_tests:
          - not_null
          - is_positive

      - name: payment_change
        data_tests:
          - not_null
          - is_positive
      
      - name: created_at
        data_tests:
          - not_null
